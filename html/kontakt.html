<section class="contact-page">

  <div class="contact-left">

    <h1>Kontaktirajte Nas</h1>

    <p>
      Ako želite više informacija o stanovima,
      kontaktirajte naš tim.
    </p>

    <div class="contact-info">

      <div class="info-item">
        📍 Novi Sad, Srbija
      </div>

      <div class="info-item">
        📞 +381 64 123 4567
      </div>

      <div class="info-item">
        📧 luxnekretnine@gmail.com
      </div>

    </div>

  </div>

  <div class="contact-box">

    <form id="contactForm">

      <input type="text" id="name" placeholder="Ime i Prezime">

      <input type="email" id="email" placeholder="Email">

      <textarea id="message" placeholder="Vaša poruka"></textarea>

      <button type="submit">
        Pošalji Poruku
      </button>

      <p id="formMessage"></p>

    </form>

  </div>

</section>
